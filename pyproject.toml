[project]
name = "neurodomain-translate"
version = "0.1.0"
description = "군사 도메인 한↔영 번역기"
requires-python = ">=3.11"

# 의존성은 requirements-*.txt 가 정본이다 (계획서 §10).
# 반입 번들이 requirements.lock.txt 와 1:1 로 대응해야 하므로
# 여기에 중복해서 적지 않는다.

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI 의 표준 관용구다. B008(인자 기본값에서 함수 호출)에서 제외한다.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
# Phase 0 은 뼈대라 타입이 덜 촘촘하다. Phase 2 에서 조인다.
disallow_untyped_defs = false
