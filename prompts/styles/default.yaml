# 문체 프리셋: 범용 — 계획서 §7.3
# 보도자료가 아닌 일반 문서에 쓴다 (D-04 "범용 사용").
name: default

ko2en:
  register: "Neutral formal register. Clear and direct."
  rules:
    - "Preserve the sentence structure of the source where natural."
    - "Rank precedes surname: 'Colonel Kim'."
    - "Keep unit designations in official English form."
    - "Preserve all numbers, dates, and units exactly."

en2ko:
  register: "격식체. 종결어미 '~한다', '~이다'."
  rules:
    - "원문의 문장 구조를 가능한 한 유지한다."
    - "직함은 이름 앞: '김OO 대령'."
    - "부대명·계급은 국군 공식 용어 사용."
    - "숫자·날짜·단위는 원문 그대로 유지한다."
